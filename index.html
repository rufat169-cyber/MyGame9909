function die(){state='dead';snd(220,50,.9,'sawtooth',.22);$('flash').style.opacity=.75;mon.visible=true;
setTimeout(()=>show('Круг поймал вас','Последнее, что вы увидели: огромный немигающий глаз и полосатый бок. Вода сомкнулась над головой.','Заново',()=>{build(cur);state='play';}),1000);}
function tap(){qv=Math.min(1.05,qv+.085);snd(300,500,.06,'square',.04);}
$('qbtn').addEventListener('touchstart',e=>{e.preventDefault();tap();},{passive:false});$('qbtn').addEventListener('mousedown',tap);
show('Ошибки планировки',$('sub').textContent,'Начать',()=>startLv(0));build(0);state='menu';
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
if(sayT>0){sayT-=dt;if(sayT<=0)$('say').style.display='none';}
if(state==='play'){let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyA)s--;if(keys.KeyD)s++;if(keys.ArrowLeft)yaw+=dt*2;if(keys.ArrowRight)yaw-=dt*2;f-=mv.y;s+=mv.x;
const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}const running=(run||keys.ShiftLeft||keys.ShiftRight)&&l>.1&&stam>0;stam=Math.max(0,Math.min(1,stam+(running?-dt*.25:dt*.15)));
const sp=(lv.water?3:3.5)*(running?1.6:1)*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),dx=(fx*f+Math.cos(yaw)*s)*sp,dz=(fz*f-Math.sin(yaw)*s)*sp;
if(free(P.x+dx,P.z))P.x+=dx;if(free(P.x,P.z+dz))P.z+=dz;
vy-=14*dt;jy=Math.max(0,jy+vy*dt);if(jy===0)vy=0;
cam.position.set(P.x,1.6+jy+(jy?0:Math.sin(t*(running?13:9))*.05*Math.min(1,l)),P.z);cam.rotation.set(pitch,yaw,0);
bR.style.opacity=.5+stam*.5;
const pi=Math.floor(P.x/S),pj=Math.floor(P.z/S);
for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ch=(grid[pj+dj]||'')[pi+di];const k=(pi+di)+','+(pj+dj);if(GAG[ch]&&!seen[k]&&Math.hypot(cx(pi+di)-P.x,cx(pj+dj)-P.z)<2.6){seen[k]=1;say(GAG[ch],3.5);}}
for(const n of npcs){n.g.rotation.y=Math.atan2(P.x-n.g.position.x,P.z-n.g.position.z)*(n.g.rotation.x?-1:1);if(!n.done&&Math.hypot(n.g.position.x-P.x,n.g.position.z-P.z)<3){n.done=true;say(n.line,7);}}
for(let k=items.length-1;k>=0;k--){const o=items[k];o.position.y=1+Math.sin(t*2+k)*.12;o.rotation.y+=dt*2;if(Math.hypot(o.position.x-P.x,o.position.z-P.z)<1.1){lvG.remove(o);items.splice(k,1);got++;upd();snd(600,1300,.15,'triangle',.08);if(got===lv.need){exitMat.color.set(0x30c060);say('Где-то щёлкнул замок. Выход открыт.',3);}}}
lockT-=dt;if(exitP&&Math.hypot(exitP.x-P.x,exitP.z-P.z)<2.3){if(got<lv.need){if(lockT<=0){say('Заперто. Нужно ещё '+(lv.need-got)+'.',2);lockT=3;}}
else if(lv.mon==='chase'){state='qte';qv=.3;$('qte').style.display='flex';snd(900,200,.5,'square',.1);say('Круг схватил вас у самой двери! Жмите изо всех сил!',4);}
else if(cur<2){startLv(cur+1);return;}}
if(lv.mon==='stalk'){if(!stShow){stTimer-=dt;mon.visible=false;if(stTimer<=0){const p=bfs(pi,pj),c=Object.keys(p).map(q=>q.split(',').map(Number)).filter(c=>{const d=Math.hypot(cx(c[0])-P.x,cx(c[1])-P.z);return d>9&&d<16;});
if(c.length){const q=c[Math.floor(Math.random()*c.length)];mp={x:cx(q[0]),z:cx(q[1])};stShow=6;mon.visible=true;}else stTimer=2;}}
else{stShow-=dt;if(stShow<=0||Math.hypot(mp.x-P.x,mp.z-P.z)<6.5){stShow=0;stTimer=7+Math.random()*6;mon.visible=false;snd(1200,400,.35,'square',.05);if(!seen.st){seen.st=1;say('Что это было?..',2.5);}}}}
if(lv.mon==='chase'){const ck=pi+','+pj;if(ck!==pCell){pCell=ck;pathMap=bfs(pi,pj);}const mi=Math.floor(mp.x/S),mj=Math.floor(mp.z/S);let tx2=P.x,tz2=P.z;
if(mi+','+mj!==ck&&pathMap){const n=pathMap[mi+','+mj];if(n){tx2=cx(n[0]);tz2=cx(n[1]);}}
const ddx=tx2-mp.x,ddz=tz2-mp.z,mdd=Math.hypot(ddx,ddz),ms=(1.7+got*.32)*dt;if(mdd>.01){mp.x+=ddx/mdd*Math.min(ms,mdd);mp.z+=ddz/mdd*Math.min(ms,mdd);}
const pd=Math.hypot(P.x-mp.x,P.z-mp.z);$('flash').style.opacity=pd<7?.2*(1-pd/7)*(.6+.4*Math.sin(t*12)):0;
heartT-=dt;if(pd<10&&heartT<=0){snd(70,40,.15,'sine',.3);heartT=.3+pd*.08;}if(pd<1.1)die();}}
else if(state==='qte'){qv-=dt*.32;$('qbar').style.width=Math.max(0,qv*100)+'%';const fx=-Math.sin(yaw),fz=-Math.cos(yaw);mp={x:P.x+fx*1.3,z:P.z+fz*1.3};cam.position.x=P.x+(Math.random()-.5)*.06;
if(qv>=1){state='end';$('qte').style.display='none';mon.visible=false;show('Вы вырвались','Круг сдулся с жалобным писком. Дверь захлопнулась за спиной... и вы оказались на подземной парковке. Бесконечной. С фонтаном посередине. Конец главы 1.','Сначала',()=>startLv(0));}
else if(qv<=0){$('qte').style.display='none';die();}}
else if(state==='menu'){cam.position.set(cx(1)+Math.sin(t*.2),1.6,cx(1)+1.5);cam.rotation.set(0,-Math.PI/2+Math.sin(t*.15)*.5,0);}
if(waterM)waterM.opacity=.45+Math.sin(t*1.5)*.05;
const fh=lv.water?1.2:1.7;mon.position.set(mp.x,fh+Math.sin(t*2.2)*.12,mp.z);if(state==='dead'){const fx=-Math.sin(yaw),fz=-Math.cos(yaw);mon.position.set(cam.position.x+fx*1.1,cam.position.y,cam.position.z+fz*1.1);}
mon.lookAt(cam.position.x,mon.position.y,cam.position.z);torus.rotation.z+=dt*.6;arms.forEach((a,i)=>a.rotation.z=Math.sin(t*3+i*2)*.4);
R.render(scene,cam);}
requestAnimationFrame(loop);
</script>
</body>
</html>
